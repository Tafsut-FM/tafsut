[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tafsut"
version = "0.1.0"
description = "Probabilistic univariate time-series forecasting with Tafsut"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Tafsut-FM" }
]
keywords = ["time-series", "forecasting", "probabilistic-forecasting", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "safetensors>=0.4",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
visualization = [
  "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/Tafsut-FM/tafsut"
Repository = "https://github.com/Tafsut-FM/tafsut"
Model = "https://huggingface.co/Tafsut-FM/tafsut-univariate-base"

[project.scripts]
tafsut-forecast = "tafsut.inference:main"

[tool.setuptools]
packages = ["tafsut"]
